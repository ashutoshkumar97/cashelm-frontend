<h1>Cash'em</h1>
<p>The bridge is yours, you have the helm. Navigate your spendings</p>

<!-- Buttons -->
<label>
  Upload Statement
  <input type="file" (change)="onFileSelected($event)" accept=".csv,.pdf">

<!-- Messages -->
<p *ngIf="isLoading">Loading...</p>
